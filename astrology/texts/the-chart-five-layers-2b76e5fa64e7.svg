<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 800" width="660" height="800" font-family="Georgia, 'Iowan Old Style', serif">
  <defs>
    <style>
      .lbl  { font-size: 20px; font-weight: 700; fill: #b03a3a; }
      .sub  { font-size: 12px;   fill: #666; font-style: italic; }
      .mund { font-size: 12px;   fill: #1f5f4b; font-weight: 700; }
      .ring { fill: none; stroke: #333; stroke-width: 1.4; }
      .plate{ fill: #ffffff; fill-opacity: .5; stroke: #aaa; stroke-width: 1; }
      .axis { stroke: #7a5ea8; stroke-width: 2; }
      .cap  { font-size: 11.5px; fill: #777; }
      .ttl  { font-size: 15px; font-weight: 700; fill: #333; letter-spacing: .5px; }
    </style>
  </defs>

  <text x="330" y="26" class="ttl" text-anchor="middle">THE CHART — five layers of one moment</text>
  <text x="330" y="45" class="cap" text-anchor="middle">one 360° circle, shown exploded. Bottom = the conditions. Top = the one who must answer them.</text>

  <line x1="200" y1="78" x2="200" y2="660" class="axis"/>

  <!-- ── 1. CENTRAL CORE ───────────────────────────────── -->
  <ellipse cx="200" cy="80" rx="14" ry="6.5" fill="#fff" stroke="#7a5ea8" stroke-width="2"/>
  <circle cx="200" cy="80" r="2.6" fill="#7a5ea8"/>
  <text x="365" y="66"  class="lbl">Central Core</text>
  <text x="365" y="84"  class="sub">the soul — the inner being</text>
  <text x="365" y="101" class="mund">THE SOVEREIGN WILL: free to choose</text>

  <!-- ── 2. ASPECTS ────────────────────────────────────── -->
  <ellipse cx="200" cy="175" rx="145" ry="46" class="plate"/>
  <ellipse cx="200" cy="175" rx="145" ry="46" class="ring"/>
  <g stroke-width="1.3" fill="none">
    <line x1="108" y1="152" x2="272" y2="199" stroke="#c0392b"/>
    <line x1="118" y1="200" x2="284" y2="157" stroke="#c0392b"/>
    <line x1="95"  y1="176" x2="300" y2="180" stroke="#2e7d32"/>
    <line x1="148" y1="145" x2="235" y2="205" stroke="#1565c0"/>
    <line x1="108" y1="152" x2="284" y2="157" stroke="#1565c0"/>
    <line x1="118" y1="200" x2="235" y2="205" stroke="#2e7d32"/>
  </g>
  <g fill="#333">
    <circle cx="108" cy="152" r="3"/><circle cx="272" cy="199" r="3"/>
    <circle cx="118" cy="200" r="3"/><circle cx="284" cy="157" r="3"/>
    <circle cx="95"  cy="176" r="3"/><circle cx="300" cy="180" r="3"/>
    <circle cx="148" cy="145" r="3"/><circle cx="235" cy="205" r="3"/>
  </g>
  <text x="365" y="160" class="lbl">Aspects</text>
  <text x="365" y="178" class="sub">unconscious motivation — the dialogue</text>
  <text x="365" y="195" class="mund">THE PLOT — where meaning lives</text>

  <!-- ── 3. PLANETS ────────────────────────────────────── -->
  <ellipse cx="200" cy="315" rx="145" ry="46" class="plate"/>
  <ellipse cx="200" cy="315" rx="145" ry="46" class="ring"/>
  <ellipse cx="200" cy="315" rx="108" ry="31" fill="none" stroke="#ccc" stroke-width="1"/>
  <g font-size="17" fill="#222" text-anchor="middle">
    <text x="80"  y="311">☉</text>
    <text x="116" y="288">☿</text>
    <text x="160" y="276">♀</text>
    <text x="235" y="275">♂</text>
    <text x="285" y="288">♃</text>
    <text x="320" y="313">♄</text>
    <text x="285" y="348">♅</text>
    <text x="200" y="360">♆</text>
    <text x="116" y="348">♇</text>
  </g>
  <text x="365" y="300" class="lbl">Planets</text>
  <text x="365" y="318" class="sub">psychological drives — gods with wants</text>
  <text x="365" y="335" class="mund">THE ACTORS: who acts, and why</text>

  <!-- ── 4. SIGNS ──────────────────────────────────────── -->
  <ellipse cx="200" cy="460" rx="145" ry="46" class="plate"/>
  <ellipse cx="200" cy="460" rx="145" ry="46" class="ring"/>
  <ellipse cx="200" cy="460" rx="105" ry="30" fill="none" stroke="#333" stroke-width="1"/>
  <g font-size="14" fill="#444" text-anchor="middle">
    <text x="78"  y="456">♓</text>
    <text x="108" y="433">♒</text>
    <text x="155" y="421">♑</text>
    <text x="200" y="417">♐</text>
    <text x="246" y="421">♏</text>
    <text x="292" y="433">♎</text>
    <text x="323" y="456">♍</text>
    <text x="292" y="490">♌</text>
    <text x="246" y="502">♋</text>
    <text x="200" y="506">♊</text>
    <text x="155" y="502">♉</text>
    <text x="108" y="490">♈</text>
  </g>
  <text x="365" y="445" class="lbl">Signs</text>
  <text x="365" y="463" class="sub">inherited qualities — the toolshed</text>
  <text x="365" y="480" class="mund">HOW WELL EQUIPPED (dignity)</text>

  <!-- ── 5. HOUSES ─────────────────────────────────────── -->
  <ellipse cx="200" cy="615" rx="160" ry="52" class="plate"/>
  <ellipse cx="200" cy="615" rx="160" ry="52" class="ring"/>
  <ellipse cx="200" cy="615" rx="108" ry="34" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <g stroke="#aaa" stroke-width="1">
    <line x1="40"  y1="615" x2="92"  y2="615"/>
    <line x1="360" y1="615" x2="308" y2="615"/>
    <line x1="200" y1="563" x2="200" y2="581"/>
    <line x1="200" y1="667" x2="200" y2="649"/>
    <line x1="82"  y1="583" x2="128" y2="597"/>
    <line x1="318" y1="583" x2="272" y2="597"/>
    <line x1="82"  y1="647" x2="128" y2="633"/>
    <line x1="318" y1="647" x2="272" y2="633"/>
  </g>
  <g font-size="11" font-weight="700" fill="#b03a3a">
    <text x="26"  y="611">AC</text>
    <text x="366" y="611">DC</text>
    <text x="189" y="557">MC</text>
    <text x="191" y="682">IC</text>
  </g>
  <text x="365" y="600" class="lbl">Houses</text>
  <text x="365" y="618" class="sub">environmental conditions — the stage</text>
  <text x="365" y="635" class="mund">WHERE IT LANDS (the nation's life)</text>

  <!-- ── footer ────────────────────────────────────────── -->
  <line x1="40" y1="712" x2="620" y2="712" stroke="#ddd"/>
  <text x="330" y="734" class="cap" text-anchor="middle">The chart is a map of the sky over ONE PLACE at ONE MOMENT — not a picture of the heavens,</text>
  <text x="330" y="752" class="cap" text-anchor="middle">but a picture of WHAT TIME IT IS, written in symbols. It draws the field of forces.</text>
  <text x="330" y="770" class="cap" text-anchor="middle" font-weight="700" fill="#7a5ea8">The core is what may ANSWER them. The chart is not fate — it is the question put to a free will.</text>
  <text x="330" y="790" class="cap" text-anchor="middle" font-style="italic">Layer model after Bruno &amp; Louise Huber. Mundane translation is Katie's.</text>
</svg>
